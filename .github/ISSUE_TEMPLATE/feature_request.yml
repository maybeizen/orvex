name: Feature request
description: Suggest an idea or enhancement for Orvex Monitor
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - apps/frontend
        - apps/api
        - apps/agent
        - packages/*
        - supabase / database
        - tooling / CI
        - other / not sure
    validations:
      required: true
