<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Uptime and infrastructure monitoring for teams. Track checks, incidents, and status pages."
    />
    <meta name="theme-color" content="#0B0D10" />
    <meta property="og:title" content="Orvex Monitor" />
    <meta
      property="og:description"
      content="Uptime and infrastructure monitoring for teams."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Orvex Monitor</title>
    <script>
      try {
        const stored = localStorage.getItem("orvex-theme");
        if (stored) {
          const parsed = JSON.parse(stored);
          document.documentElement.classList.toggle(
            "dark",
            parsed.state.theme !== "light",
          );
        }
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
